name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled
      - synchronize
      - reopened

concurrency:
  group: publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Create publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.CLI_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.CLI_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
          token: ${{ steps.publisher.outputs.token }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Wait for tests to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Waiting for tests.yml workflow to complete for SHA ${PR_HEAD_SHA}..."
          for i in $(seq 1 60); do
            RUN_STATUS=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow tests.yml \
              --event pull_request \
              --commit "$PR_HEAD_SHA" \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "not_found")

            STATUS=$(echo "$RUN_STATUS" | awk '{print $1}')
            CONCLUSION=$(echo "$RUN_STATUS" | awk '{print $2}')

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Tests completed successfully!"
                exit 0
              else
                echo "Tests finished with conclusion: $CONCLUSION"
                exit 1
              fi
            fi

            echo "Attempt $i/60: tests still $STATUS, waiting 30s..."
            sleep 30
          done
          echo "Timed out waiting for tests to complete"
          exit 1

      - name: Verify the PR is still current and approved for publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid,labels | \
            jq --exit-status --arg sha "$PR_HEAD_SHA" \
              '.state == "OPEN" and .headRefOid == $sha and any(.labels[]; .name == "pr-pull")'

      # pr-pull adds the PR's commits to the workspace. Copy the cleanup script
      # from the base branch first so this privileged job never runs PR code.
      - name: Stage cleanup script from the base branch
        run: cp .github/scripts/close-published-pr.cjs "$RUNNER_TEMP/"

      # Pin pr-pull to the revision verified above, not whatever the PR head is now.
      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$PR_HEAD_SHA" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          branch: main

      # pr-pull rebases the commits, so GitHub may leave the original PR open.
      # The publisher app's contents-only token cannot manage PR state.
      # The release is already on main, so a cleanup failure must not fail the
      # run: release alerts then reports the open PR as published, not as a
      # publishing failure that invites a retry.
      - name: Close the published PR
        id: close
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { closePublishedPr } = require(`${process.env.RUNNER_TEMP}/close-published-pr.cjs`);
            await closePublishedPr({ github, context });

      - name: Delete branch
        if: steps.close.outcome == 'success' && github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git push --force-with-lease="refs/heads/$BRANCH:$PR_HEAD_SHA" --delete origin "$BRANCH"
