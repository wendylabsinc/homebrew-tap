name: brew test-bot

on:
  push:
  pull_request:

jobs:
  style:
    name: tap style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the entire tap before macOS tests
        run: brew style wendylabsinc/tap
      - name: Test release monitoring
        run: node --test .github/scripts/*.test.cjs

  test-bot:
    needs: style
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 45
    strategy:
      matrix:
        # macOS ARM64 only (using pre-built binaries, no bottles needed)
        # Ubuntu disabled - uses pre-built binaries from releases
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # Tap CI defaults to unreleased Homebrew; validate against releases.
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Clean up runner and keep stable Homebrew
        run: |
          brew_repository="$(brew --repository)"
          brew_revision="$(git -C "$brew_repository" rev-parse HEAD)"
          brew test-bot --only-cleanup-before
          # test-bot cleanup checks out main; restore the release selected above.
          git -C "$brew_repository" checkout --detach "$brew_revision"

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Style and audit casks
        run: |
          shopt -s nullglob
          casks=(Casks/*.rb)
          if [ ${#casks[@]} -eq 0 ]; then
            echo "No casks to check"
            exit 0
          fi

          brew style --display-cop-names "${casks[@]}"

          for cask in "${casks[@]}"; do
            cask_name=$(basename "$cask" .rb)
            echo "Auditing ${cask_name}"
            brew audit --cask --strict "$cask_name"
          done

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
