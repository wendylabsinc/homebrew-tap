name: nightly bottle

on:
  push:
    branches:
      - main
    paths:
      - Formula/wendy-nightly.rb

jobs:
  bottle:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          version=$(sed -n 's/.*root_url "https:\/\/github.com\/wendylabsinc\/homebrew-tap\/releases\/download\/wendy-nightly-\(.*\)"/\1/p' Formula/wendy-nightly.rb)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "wendy-nightly-${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Homebrew
        if: steps.check.outputs.exists == 'false'
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bottle
        if: steps.check.outputs.exists == 'false'
        run: |
          brew install --build-bottle wendylabsinc/tap/wendy-nightly
          # --no-rebuild: always publish a rebuild-0 bottle, whose asset name has
          # no ".N" suffix. A `rebuild N` line in the formula makes Homebrew
          # request "...bottle.N.tar.gz", which is never uploaded (404).
          # --json: emit the bottle block as JSON for the merge step below.
          brew bottle --no-rebuild --json \
            --root-url "https://github.com/wendylabsinc/homebrew-tap/releases/download/wendy-nightly-${{ steps.version.outputs.version }}" \
            wendylabsinc/tap/wendy-nightly

      - name: Update bottle block
        if: steps.check.outputs.exists == 'false'
        run: |
          # Let Homebrew rewrite the formula's `bottle do` block (root_url,
          # rebuild, cellar, sha256) from the JSON it just produced, rather than
          # patching it with sed. The old sed only matched
          # `cellar: :any_skip_relocation` and silently no-op'd otherwise, leaving
          # a stale sha256 and `rebuild` in the formula. setup-homebrew symlinks
          # the tap at this checkout, so the write lands in Formula/ here.
          brew bottle --merge --write --no-commit --no-all-checks ./wendy-nightly--*.bottle.json
          git --no-pager diff Formula/wendy-nightly.rb

      - name: Commit updated bottle block
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Formula/wendy-nightly.rb; then
            git add Formula/wendy-nightly.rb
            git commit -m "wendy-nightly: update ${{ steps.version.outputs.version }} bottle"
            git push origin main
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          # Rename from double-dash to single-dash format (matches the URL
          # Homebrew derives from root_url + formula name + version)
          for f in wendy-nightly--*.bottle.tar.gz; do
            mv "$f" "${f/wendy-nightly--/wendy-nightly-}"
          done
          gh release create "wendy-nightly-${{ steps.version.outputs.version }}" \
            --title "wendy-nightly ${{ steps.version.outputs.version }}" \
            --notes "Nightly bottle for wendy-nightly ${{ steps.version.outputs.version }}" \
            --prerelease \
            wendy-nightly-*.bottle.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
